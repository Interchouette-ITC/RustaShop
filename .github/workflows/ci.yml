name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "**"
              - "!**/*.md"

  lint:
    name: fmt · clippy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping heavy lint"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: make lint

  test:
    name: workspace tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rustashop
          POSTGRES_PASSWORD: rustashop
          POSTGRES_DB: rustashop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustashop -d rustashop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rustashop:rustashop@127.0.0.1:5432/rustashop
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping heavy tests"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: make test

  doc:
    name: rustdoc
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping rustdoc"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Doc
        if: needs.changes.outputs.code == 'true'
        run: make doc

  shop-angular:
    name: shop-angular
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shops/angular
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping shop-angular"
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shops/angular/package-lock.json
      - name: Makefile shop-angular guards
        if: needs.changes.outputs.code == 'true'
        working-directory: .
        run: |
          # Proxy URL must not double the scheme (regression from sed wrapping).
          raw='127.0.0.1:8080'
          case "$raw" in http://*|https://*) p="${raw%/}" ;; *) p="http://${raw%/}" ;; esac
          test "$p" = "http://127.0.0.1:8080"
          raw='http://127.0.0.1:8081'
          case "$raw" in http://*|https://*) p="${raw%/}" ;; *) p="http://${raw%/}" ;; esac
          test "$p" = "http://127.0.0.1:8081"
          # ng serve no longer accepts --base-href; Make must not pass it.
          ! grep -nE 'npm start -- .*--base-href' Makefile
      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: npm ci
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: npm run lint
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

  admin-angular:
    name: admin-angular
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin/angular
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping admin-angular"
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/angular/package-lock.json
      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: npm ci
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: npm run lint
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

  install-ui:
    name: install-ui
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: install
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping install-ui"
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: install/package-lock.json
      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: npm ci
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

  supply-chain:
    name: supply-chain
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Markdown-only
        if: needs.changes.outputs.code != 'true'
        run: echo "markdown-only; skipping supply-chain"
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Install cargo-audit and cargo-deny
        if: needs.changes.outputs.code == 'true'
        run: |
          cargo install --locked cargo-audit --version 0.22.0
          cargo install --locked cargo-deny --version 0.20.2
      - name: Cargo audit and deny
        if: needs.changes.outputs.code == 'true'
        run: make audit && make deny
      - name: npm audit shop
        if: needs.changes.outputs.code == 'true'
        working-directory: shops/angular
        run: npm ci && npm audit --audit-level=high --omit=dev && NPM_CONFIG_MIN_RELEASE_AGE=0 npx --yes --package=cve-lite-cli@1.33.0 cve-lite . --fail-on high
      - name: npm audit admin
        if: needs.changes.outputs.code == 'true'
        working-directory: admin/angular
        run: npm ci && npm audit --audit-level=high --omit=dev && NPM_CONFIG_MIN_RELEASE_AGE=0 npx --yes --package=cve-lite-cli@1.33.0 cve-lite . --fail-on high
      - name: npm audit install
        if: needs.changes.outputs.code == 'true'
        working-directory: install
        run: npm ci && npm audit --audit-level=high --omit=dev && NPM_CONFIG_MIN_RELEASE_AGE=0 npx --yes --package=cve-lite-cli@1.33.0 cve-lite . --fail-on high
      - name: Malware IoC scan
        if: needs.changes.outputs.code == 'true'
        run: node scripts/npm-malware-scan.mjs .
