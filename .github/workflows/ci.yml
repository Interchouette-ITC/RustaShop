name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  lint:
    name: fmt · clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: make lint

  test:
    name: workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rustashop
          POSTGRES_PASSWORD: rustashop
          POSTGRES_DB: rustashop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustashop -d rustashop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rustashop:rustashop@127.0.0.1:5432/rustashop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: make test

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Doc
        run: make doc

  shop-angular:
    name: shop-angular
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/shop-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shop-angular/package-lock.json
      - name: Makefile shop-angular guards
        working-directory: .
        run: |
          # Proxy URL must not double the scheme (regression from sed wrapping).
          raw='127.0.0.1:8080'
          case "$raw" in http://*|https://*) p="${raw%/}" ;; *) p="http://${raw%/}" ;; esac
          test "$p" = "http://127.0.0.1:8080"
          raw='http://127.0.0.1:8081'
          case "$raw" in http://*|https://*) p="${raw%/}" ;; *) p="http://${raw%/}" ;; esac
          test "$p" = "http://127.0.0.1:8081"
          # ng serve no longer accepts --base-href; Make must not pass it.
          ! grep -nE 'npm start -- .*--base-href' Makefile
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
