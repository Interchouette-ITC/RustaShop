[package]
name = "rustashop-api"
description = "Actix-web commerce API (OpenAPI via utoipa in later slices)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rustashop-api"
path = "src/main.rs"

[features]
default = ["persist-sqlx"]
persist-sqlx = ["rustashop-persist/persist-sqlx"]
persist-seaorm = ["rustashop-persist/persist-seaorm"]

[dependencies]
actix-web = { workspace = true }
rustashop = { workspace = true }
rustashop-domain = { workspace = true }
rustashop-persist = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
actix-web = { workspace = true }
