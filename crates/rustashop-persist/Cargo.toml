[package]
name = "rustashop-persist"
description = "Persistence facade: compile-time SQLx or SeaORM backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["persist-sqlx"]
persist-sqlx = ["dep:rustashop-persist-sqlx"]
persist-seaorm = ["dep:rustashop-persist-seaorm"]

[dependencies]
rustashop-persist-sqlx = { workspace = true, optional = true }
rustashop-persist-seaorm = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
sqlx = { workspace = true }

[lints]
workspace = true
