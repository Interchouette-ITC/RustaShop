services:
  postgres:
    image: postgres:16-alpine
    container_name: rustashop-postgres
    environment:
      POSTGRES_USER: rustashop
      POSTGRES_PASSWORD: rustashop
      POSTGRES_DB: rustashop
    ports:
      - "5432:5432"
    volumes:
      - rustashop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustashop -d rustashop"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  rustashop_pgdata:
