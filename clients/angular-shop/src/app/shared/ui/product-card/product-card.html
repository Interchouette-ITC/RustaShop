<article class="product-card h-100 p-3 border rounded-2 bg-white">
  <h2 class="h5 mb-1">
    <a [routerLink]="['/products', product().id]">{{ product().name }}</a>
  </h2>
  <p class="small text-muted mb-2">{{ product().slug }}</p>
  @if (product().description; as description) {
    <p class="mb-3 small">{{ description }}</p>
  }
  <a class="btn btn-sm btn-outline-primary" [routerLink]="['/products', product().id]">View</a>
</article>
