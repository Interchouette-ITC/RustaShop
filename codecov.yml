# Paths excluded from Codecov totals (bins, generated adapters, templates).
# Upload token stays in GitHub Actions secrets, not here.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "crates/**/src/bin/**/*"
  - "shops/**/generated/**/*"
  - "admin/**/generated/**/*"
  - "templates/**/*"
  - "**/node_modules/**/*"
  - "**/.angular/**/*"
